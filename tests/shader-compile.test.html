<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shader compile diagnostics</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #0d1117;
    color: #d5dde6;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.lead { color: #7d8894; margin: 0 0 18px; }
  .case { border-top: 1px solid #232c38; padding: 10px 0; }
  .name { font-weight: 600; }
  .ok { color: #5fd68a; }
  .fail { color: #ff5c6c; }
  .skip { color: #7d8894; }
  pre {
    margin: 6px 0 0;
    padding: 8px 10px;
    background: #2a1216;
    color: #ff5c6c;
    border-radius: 6px;
    white-space: pre-wrap;
    overflow-x: auto;
  }
  #summary { margin-top: 18px; font-weight: 600; }
</style>
</head>
<body>
  <h1>Shader compile diagnostics</h1>
  <p class="lead">
    Compiles the default shader (and its 3D / camera variants) against real WebGL2 / WebGL1
    contexts. Serve the project and open this file, e.g.
    <code>http://localhost:8000/tests/shader-compile.test.html</code>.
  </p>
  <div id="results"></div>
  <div id="summary"></div>

<script src="shader-harness.js"></script>
<script>
"use strict";

const resultsEl = document.getElementById("results");
const summaryEl = document.getElementById("summary");
let passed = 0;
let failed = 0;
let skipped = 0;

function report(name, status, detail) {
  const box = document.createElement("div");
  box.className = "case";
  const head = document.createElement("div");
  head.className = "name " + status;
  head.textContent = `${status === "ok" ? "ok  -" : status === "fail" ? "FAIL -" : "skip -"} ${name}`;
  box.appendChild(head);
  if (detail) {
    const pre = document.createElement("pre");
    pre.textContent = detail;
    box.appendChild(pre);
  }
  resultsEl.appendChild(box);
  if (status === "ok") passed += 1;
  else if (status === "fail") failed += 1;
  else skipped += 1;
}

const H = window.ShaderHarness;

function contexts() {
  const canvas = document.createElement("canvas");
  canvas.width = 32;
  canvas.height = 32;
  const out = [];
  const gl2 = canvas.getContext("webgl2", { antialias: false });
  if (gl2) out.push({ label: "WebGL2 / GLSL ES 3.00", gl: gl2, isGL2: true });
  const c1 = document.createElement("canvas");
  const gl1 = c1.getContext("webgl", { antialias: false });
  if (gl1) out.push({ label: "WebGL1 / GLSL ES 1.00", gl: gl1, isGL2: false });
  return out;
}

async function run() {
  let parts;
  let base;
  try {
    const sources = await H.loadSources("../app.js");
    parts = sources.parts;
    base = sources.shader;
  } catch (err) {
    report("extract shader sources from app.js", "fail",
      `${err.message}\nServe the folder over HTTP (file:// blocks fetch).`);
    summaryEl.textContent = "1 failed";
    return;
  }
  report("extract shader sources from app.js", "ok");

  const withConsts = (pairs) => H.withConsts(base, pairs);

  // Each variant flips consts the Controls panel would rewrite.
  const variants = [
    { name: "default (3D + camera off)", shader: base },
    { name: "3D relief on", shader: withConsts({ u3D: "1" }) },
    { name: "3D relief + refraction", shader: withConsts({ u3D: "1", u3DRefract: "0.45" }) },
    { name: "3D relief + gradient color mode", shader: withConsts({ u3D: "1", uColorMode: "1" }) },
    {
      name: "3D relief + mouse interact + anchors",
      shader: withConsts({
        u3D: "1", uMouseInteract: "2", uAnchorCount: "3",
        uA0Mode: "4", uA1Mode: "1", uA2Mode: "5",
      }),
    },
    { name: "camera on", shader: withConsts({ uCam: "1" }) },
    { name: "camera top-down (pitch 0)", shader: withConsts({ uCam: "1", uCamPitch: "0.0" }) },
    {
      name: "camera grazing horizon + depth fade",
      shader: withConsts({ uCam: "1", uCamPitch: "88.0", uCamHaze: "0.9" }),
    },
    {
      name: "camera + depth of field",
      shader: withConsts({ uCam: "1", uCamAperture: "1.0", uCamFocus: "0.8" }),
    },
    { name: "camera + 3D relief", shader: withConsts({ uCam: "1", u3D: "1" }) },
    {
      name: "camera + 3D + refraction + depth of field",
      shader: withConsts({
        uCam: "1", uCamAperture: "0.8", u3D: "1", u3DRefract: "0.4",
      }),
    },
    {
      name: "camera + 3D + gradient + interact + anchors",
      shader: withConsts({
        uCam: "1", u3D: "1", uColorMode: "1", uMouseInteract: "2",
        uAnchorCount: "3", uA0Mode: "4", uA1Mode: "1", uA2Mode: "5",
      }),
    },
  ];

  const ctxs = contexts();
  if (ctxs.length === 0) {
    report("acquire a WebGL context", "fail", "no WebGL1 or WebGL2 context available");
    summaryEl.textContent = "1 failed";
    return;
  }
  if (!ctxs.some((c) => c.isGL2)) {
    report("WebGL2 context", "skip", "WebGL2 unavailable in this browser; only WebGL1 was tested");
  }

  for (const ctx of ctxs) {
    for (const variant of variants) {
      const res = H.checkProgram(ctx.gl, ctx.isGL2, parts, variant.shader);
      report(`${ctx.label} — ${variant.name}`, res.ok ? "ok" : "fail", res.ok ? "" : res.log);
    }
  }

  const bits = [`${passed} passed`];
  if (failed) bits.push(`${failed} failed`);
  if (skipped) bits.push(`${skipped} skipped`);
  summaryEl.textContent = bits.join(", ");
  summaryEl.className = failed ? "fail" : "ok";
}

run();
</script>
</body>
</html>
